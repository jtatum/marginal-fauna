<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" fill="none" stroke="#594a38" stroke-linecap="round" stroke-linejoin="round">
  <title>The Errata Louse — a correction without its replacement</title>
  <desc>A loose paper slip reads p. 17: moth should read, followed by a scalloped hole. The full stop beyond the hole is a very small louse, with six nearly invisible legs.</desc>
